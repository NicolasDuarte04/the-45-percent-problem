# Rewired 2026-05-27 (cp-05). Previously called scripts/generate_snapshot.py
# which produced M0 numbers that overwrote the M2 deploy under amendment v1.1.
# Now calls scripts/regenerate_snapshot_from_batch.py which re-aggregates
# the website JSON bundle from the locked M2 batch (data/calibration/active_batch.json).
# The Elo fetch and the canonical-draw export were removed from this path;
# the new script consumes neither. See GO_TO_LAUNCH.md Checkpoint 2.
# TODO: if a future batch needs fresh Elo ratings pre-run, add a dedicated
# fetch_elo.yml workflow rather than restoring it here.
name: Nightly Simulation Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_r16_checkpoint:
        description: >-
          cp-25b manual override: publish the R16 kill-criterion checkpoint now,
          bypassing the settled-R16-count gate. Ignored once the checkpoint has
          already been published (it is carried forward byte-identical). Leave
          false for normal nightly runs.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Generate snapshot and publish to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Pushes to main use the default GITHUB_TOKEN. The workflow-level
          # permissions: contents: write block above is sufficient; no PAT
          # is required. Confirmed empirically on 2026-05-27 by probe run
          # 26534292687 on branch probe/github-token, which executed the
          # full pipeline including the push step with no token override.
          # The previous SNAPSHOT_PUSH_TOKEN dependency was a fine-grained
          # PAT that expired on its 30-day cycle and caused the 2026-05-27
          # nightly to fail at checkout; the original "PAT required to
          # bypass branch protection" rationale was wrong from day one
          # because this is a free-plan private repo with no branch
          # protection available.

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Fetch concrete knockout pairings from Football-Data (cp-20)
        # cp-20: refresh data/live/knockout_pairings.json BEFORE the regen step
        # below, so emit_live_knockout_matches sees the current draw and the
        # Matches page self-populates knockout cards on every nightly run. This
        # replaces the old manual two-step (dispatch "Refresh WC 2026 kickoff
        # schedule", then dispatch a regen); no operator orchestration needed.
        #
        # cp-30: this now runs BEFORE the odds fetch below, because the odds
        # resolver consults this same file (data/live/knockout_pairings.json) to
        # map Odds API knockout events to their KO-FD ids. Refreshing the draw
        # first means the odds pull resolves against today's pairings, not the
        # last-committed ones.
        #
        # Scope and isolation: a read-only learner of who-plays-whom. Writes ONLY
        # data/live/knockout_pairings.json (a separate namespace). It never writes
        # match_outcomes and never touches the FINISHED-only graded settled stream,
        # so no knockout outcome can reach the frozen ledger or the conditioning
        # path. A played knockout's realized score comes from the separate
        # match_outcomes path (ingest_match_outcomes.yml), not from this feed.
        #
        # Non-fatal by design: a transient FD outage or rate-limit must not break
        # the nightly snapshot/odds/bracket publish. On failure the script writes
        # nothing, the checkout's last committed pairings stay in place, the odds
        # resolver and regen reuse them, and the run continues. Until the draw
        # resolves the file lists zero pairings and the knockout surface stays empty.
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python ingestion/fetch_knockout_pairings.py \
            || echo "::warning title=knockout-pairings::FD fetch failed; odds resolver and regen will reuse the last committed data/live/knockout_pairings.json"

      - name: Fetch real Pinnacle odds (Tier 2; The Odds API)
        # cp-odds-schedule: pull live Pinnacle 1X2 lines ONCE per day, before the
        # regen step below reads data/raw/odds_pinnacle.parquet. With real odds
        # present the regen emits a LIVE divergence (non-synthetic); without them
        # it stays "pending". This is the only place the producer runs - the
        # on-demand twin (on_demand_regen.yml) deliberately does NOT pull, it
        # re-reads the committed parquet, so we stay at one pull per day.
        #
        # cp-30: knockout h2h events now resolve to their KO-FD ids via the
        # pairings file refreshed in the step above, so the daily pull produces
        # LIVE knockout 1X2 divergence (not just group matches). Group resolution
        # is unchanged for the historical record.
        #
        # Cost: one GET (sport=soccer_fifa_world_cup, markets=h2h,
        # bookmakers=pinnacle, regions=us,uk,eu) ~= 3 credits, ~90/month, well
        # inside the 500/month free tier. Safe failure mode: if the key's tier
        # does not surface Pinnacle (or WC lines are not open yet), the producer
        # falls back to synthetic and divergence stays pending - nothing breaks.
        # The key is referenced only via the secret; it is never printed.
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python ingestion/fetch_odds_pinnacle.py --source oddsapi --force

      - name: Regenerate snapshot bundle from locked M2 batch
        # cp-10: settled-result conditioning reads match_outcomes from
        # Postgres when no data/processed/match_outcomes.parquet is staged.
        # DIRECT_URL is preferred over DATABASE_URL to bypass any pgbouncer
        # pooler - long-running batch scripts hit prepared-statement issues
        # behind a pooler. Both secrets are already provisioned at the repo
        # level (see snapshot-deploy.yml for the website CI usage).
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # cp-25b: manual override for the R16 kill-criterion checkpoint. Empty
          # on scheduled runs (the checkpoint fires on the settled-R16 count).
          R16_CHECKPOINT_FORCE: ${{ github.event.inputs.force_r16_checkpoint }}
        run: python scripts/regenerate_snapshot_from_batch.py

      - name: Regenerate snapshotProbs.ts from M2 batch
        # cp-11 (Fix 3): close the M0/M2 split-brain. Re-derives the static
        # evaluator table website/src/lib/sim/snapshotProbs.ts from the active
        # M2 batch so prediction grading and the bracket serve the same model.
        # Runs after the snapshot regen (so the active batch + teams/ roster are
        # current) and before staging (so the file lands in the nightly commit).
        run: python scripts/generate_snapshot_probs_ts.py

      - name: Stage updated website data files
        id: stage
        run: |
          # cp-25b: persist the R16 checkpoint artifact when it is first
          # published (it lives under website/public/data/, already covered by
          # the `git add website/public/data/` below; called out here for the
          # reviewer's benefit).
          # cp-odds-schedule: persist the odds parquet ONLY when this pull
          # returned real (non-synthetic) lines, so the on-demand regen can
          # re-read the last nightly's odds and keep divergence live (and
          # re-run the staleness gate against the new generation time). On a
          # synthetic-fallback day nothing is staged here: divergence stays
          # pending and no useless binary churn lands in git. odds_are_synthetic
          # is the single source of truth for the synthetic/real decision.
          ODDS_PARQUET="data/raw/odds_pinnacle.parquet"
          if [ -f "$ODDS_PARQUET" ] && \
             ! python -c "import pandas as pd; from market.divergence_generator import odds_are_synthetic; raise SystemExit(0 if odds_are_synthetic(pd.read_parquet('$ODDS_PARQUET')) else 1)"; then
            git add "$ODDS_PARQUET"
            echo "Odds parquet carries real lines; staged for commit."
          else
            echo "Odds parquet absent or synthetic; not committing (divergence stays pending)."
          fi
          # snapshotProbs.ts lives under website/src/, NOT website/public/data/,
          # so it must be staged explicitly in addition to the data bundle.
          git add website/public/data/ website/src/lib/sim/snapshotProbs.ts
          # cp-20: persist the refreshed knockout pairings in the daily commit so
          # the source-of-truth file rides forward as the next run's last-good
          # base. Guarded because the file is absent only if the very first FD
          # fetch failed before any pairings were ever committed.
          if [ -f data/live/knockout_pairings.json ]; then
            git add data/live/knockout_pairings.json
          fi
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit and push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly to main
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): nightly snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Defensive rebase in case a code change landed on main during
          # this run. --autostash handles any untracked-but-modified files
          # the Python scripts may have left behind (logs, caches, raw
          # parquet outputs). The runner is ephemeral, so we don't care
          # about restoring the stash post-push - only the committed data
          # files matter.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Trigger Vercel deploy hook (belt-and-braces)
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          set -e
          HTTP_CODE=$(curl -s -o /tmp/vercel.out -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel hook HTTP $HTTP_CODE"
          cat /tmp/vercel.out || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Vercel deploy hook non-2xx ($HTTP_CODE). The push to main should still trigger a deploy via the Git integration."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Changes detected: ${{ steps.stage.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pushed to main: ${{ steps.stage.outputs.has_changes == 'true' }}" >> $GITHUB_STEP_SUMMARY
