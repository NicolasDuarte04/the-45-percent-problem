name: Nightly Simulation Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Generate snapshot and push to deploy/snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Build WC 2026 fixture table (hardcoded, no network required)
        run: python ingestion/fetch_wc2026_fixtures.py --force

      - name: Fetch fresh Elo ratings from eloratings.net
        run: python ingestion/fetch_elo_ratings.py --force

      - name: Run snapshot generator
        run: python scripts/generate_snapshot.py

      - name: Normalize snapshot for website schema
        run: python scripts/normalize_snapshot.py

      - name: Stage updated website data files
        id: stage
        run: |
          git add website/public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit and push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data changes
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): nightly pipeline update"

      - name: Push to deploy/snapshot (triggers CI gate and Vercel rebuild)
        if: steps.stage.outputs.has_changes == 'true'
        run: git push origin HEAD:deploy/snapshot
