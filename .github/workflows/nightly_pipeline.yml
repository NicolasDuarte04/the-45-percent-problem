name: Nightly Simulation Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Generate snapshot and publish to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # SNAPSHOT_PUSH_TOKEN is a fine-grained PAT with contents:write on
          # this repo, owned by an account on the branch-protection bypass
          # list. The default GITHUB_TOKEN cannot push to a protected main.
          token: ${{ secrets.SNAPSHOT_PUSH_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Export canonical WC 2026 draw JSON for Python pipeline
        working-directory: website
        run: pnpm tsx scripts/export-canonical-draw-json.ts

      - name: Build WC 2026 fixture table (hardcoded, no network required)
        run: python ingestion/fetch_wc2026_fixtures.py --force

      - name: Fetch fresh Elo ratings from eloratings.net
        run: python ingestion/fetch_elo_ratings.py --force

      - name: Run snapshot generator
        run: python scripts/generate_snapshot.py

      - name: Normalize snapshot for website schema
        run: python scripts/normalize_snapshot.py

      - name: Stage updated website data files
        id: stage
        run: |
          git add website/public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit and push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly to main
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): nightly snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Defensive rebase in case a code change landed on main during
          # this run. --autostash handles any untracked-but-modified files
          # the Python scripts may have left behind (logs, caches, raw
          # parquet outputs). The runner is ephemeral, so we don't care
          # about restoring the stash post-push — only the committed data
          # files matter.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Trigger Vercel deploy hook (belt-and-braces)
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          set -e
          HTTP_CODE=$(curl -s -o /tmp/vercel.out -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel hook HTTP $HTTP_CODE"
          cat /tmp/vercel.out || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Vercel deploy hook non-2xx ($HTTP_CODE). The push to main should still trigger a deploy via the Git integration."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Changes detected: ${{ steps.stage.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pushed to main: ${{ steps.stage.outputs.has_changes == 'true' }}" >> $GITHUB_STEP_SUMMARY
