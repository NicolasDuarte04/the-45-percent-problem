# cp-19. Re-source the WC 2026 kickoff schedule from Football-Data.org and
# publish the corrected display times.
#
# Why a separate, manual workflow: the live Football-Data key only exists in CI
# (FOOTBALL_DATA_API_KEY repository secret), and the correction is gated by a
# hard verification check against the official anchor times. The operator runs
# this when the schedule needs a refresh; it never fires on a schedule, so it
# can't surprise-publish.
#
# What it does (all safe-by-construction):
#   1. Regenerate the canonical-draw sidecar from the TS source of truth.
#   2. Fetch every WC fixture from Football-Data (all statuses) and build the
#      per-match kickoff map. The build HARD-STOPS if the FD times disagree
#      with the official anchors, so a bad feed commits nothing.
#   3. Heal the published latest/matches/*.json kickoffs from that map.
#   4. Commit the map, the website override, and the healed snapshot to main,
#      then ping the Vercel deploy hook.
#
# Required repository secret: FOOTBALL_DATA_API_KEY (the same free-tier key the
# hourly outcome ingest already uses).

name: Refresh WC 2026 kickoff schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report = list every FD-vs-anchor mismatch and FD-vs-published move, write nothing; publish = run the gate and publish."
        type: choice
        options: [report, publish]
        default: publish

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Guard against forks running this with their own secrets.
    if: github.repository == 'NicolasDuarte04/the-45-percent-problem'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: ./website
        run: pnpm install --frozen-lockfile

      - name: Regenerate canonical-draw sidecar from the TS source of truth
        working-directory: ./website
        run: pnpm tsx scripts/export-canonical-draw-json.ts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project (Python)
        run: pip install -e .

      - name: Report-all (FD vs anchors and vs published; writes nothing)
        if: inputs.mode == 'report'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/build_wc2026_schedule.py --report

      - name: Re-source kickoffs from Football-Data (verification-gated)
        if: inputs.mode == 'publish'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/build_wc2026_schedule.py

      - name: Re-source concrete knockout pairings from Football-Data (cp-17 Stage 2b)
        if: inputs.mode == 'publish'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        # Read-only learner of who-plays-whom in the knockouts. Writes only
        # data/live/knockout_pairings.json (a new namespace); it never touches
        # match_outcomes or the FINISHED-only settled stream. Until the real
        # draw resolves, both teams are TBD and the file lists zero pairings, so
        # the per-match live knockout surface stays empty.
        run: python ingestion/fetch_knockout_pairings.py

      - name: Heal published snapshot kickoffs
        if: inputs.mode == 'publish'
        run: |
          python -c "from pathlib import Path; \
          from scripts.regenerate_snapshot_from_batch import load_kickoff_overrides, overlay_kickoffs; \
          n = overlay_kickoffs(Path('website/public/data/latest/matches'), load_kickoff_overrides()); \
          print(f'healed {n} kickoff(s) in latest/matches')"

      - name: Stage corrected schedule files
        id: stage
        if: inputs.mode == 'publish'
        run: |
          git add data/raw/wc2026_kickoffs.json \
                  website/src/lib/data/wc2026-kickoffs.ts \
                  data/live/knockout_pairings.json \
                  website/public/data/latest/matches/
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh WC 2026 kickoff schedule from Football-Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Trigger Vercel deploy hook
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          set -e
          HTTP_CODE=$(curl -s -o /tmp/vercel.out -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel hook HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Vercel deploy hook non-2xx ($HTTP_CODE). The push to main should still deploy via the Git integration."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Kickoff schedule refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changes published: ${{ steps.stage.outputs.has_changes }}" >> "$GITHUB_STEP_SUMMARY"
