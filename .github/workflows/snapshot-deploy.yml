name: Site CI (PR validation)

# Runs the heavy gates on PRs targeting main (code review path) and
# manually via workflow_dispatch. NO LONGER triggered by data pushes.
# Data updates flow nightly_pipeline.yml -> main -> Vercel directly.

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/snapshot-deploy.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Validate, build, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./website

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zod contract validation
        run: pnpm run test:contracts

      - name: Unit tests
        run: pnpm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Check forbidden words (prebuild)
        run: node scripts/check-forbidden-words.mjs

      - name: Generate /healthz (prebuild)
        run: node scripts/generate-healthz.mjs

      - name: Build (next build --profile)
        run: pnpm exec next build --profile
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Playwright visual regression
        run: pnpm run test:visual
        env:
          CI: '1'

      - name: axe accessibility audit
        run: pnpm run test:a11y

      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
