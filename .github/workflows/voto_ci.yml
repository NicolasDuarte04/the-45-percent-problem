# Session 15 — El Voto del 21 de Junio CI gate.
#
# The 21J engine suite (the-21j-problem/tests, 130 tests as of Session 15) ran
# in NO workflow before this file: the root ci.yml pytest is scoped by
# `testpaths = ["tests"]` to the World-Cup suite, deliberately (see the ci.yml
# header and the 2026-06-05 El Voto coordination). Now that
# voto_snapshot_publish.yml auto-runs the engine daily on main, an engine
# regression would ship uncaught. This workflow closes that gap.
#
# Isolation discipline (same as everywhere else in this repo):
#   * separate file — ci.yml is untouched and stays WC-scoped;
#   * path-filtered to the surfaces that can actually regress the 21J engine
#     (the-21j-problem/**, the shared root pyproject.toml, and this file), so
#     WC-only PRs do not pick up an extra required check;
#   * no VOTO_ or WC secrets — the suite is offline and database-free.
#
# Python 3.9 to match voto_snapshot_publish.yml and the WC pipeline: the
# committed 21J snapshots were generated on 3.9 and the suite exercises the
# same hashing/serialization paths. eval_type_backport is required for the 21J
# Pydantic `X | None` annotations on 3.9 (same workflow-local install as the
# publish cron; intentionally not added to the root pyproject).
#
# Note for a fresh runner: the suite writes scratch updates into
# the-21j-problem/data/ while running (corpus/registry/snapshot fixtures).
# That is fine here — this job never commits — but do not add a
# commit-or-push step to this workflow without first cleaning the tree.

name: Voto 21J CI

on:
  pull_request:
    paths:
      - 'the-21j-problem/**'
      - 'pyproject.toml'
      - '.github/workflows/voto_ci.yml'
  push:
    branches: [main]
    paths:
      - 'the-21j-problem/**'
      - 'pyproject.toml'
      - '.github/workflows/voto_ci.yml'

concurrency:
  group: voto-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  voto-tests:
    name: 21J engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev tooling)
        run: |
          pip install -e ".[dev]"
          pip install eval_type_backport

      - name: pytest (the-21j-problem/tests)
        run: pytest -q the-21j-problem/tests
