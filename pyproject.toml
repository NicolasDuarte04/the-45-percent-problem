[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-45-percent-problem"
version = "0.1.0"
description = "A probabilistic pricing framework for the FIFA World Cup 2026"
requires-python = ">=3.9"

dependencies = [
    # ── Core data ──────────────────────────────────────────────────────────────
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "scipy>=1.11",

    # ── Data validation ────────────────────────────────────────────────────────
    "pydantic>=2.5",
    "pydantic-settings>=2.1",

    # ── Configuration ──────────────────────────────────────────────────────────
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # ── HTTP & scraping ────────────────────────────────────────────────────────
    "httpx>=0.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # ── Logging & CLI ──────────────────────────────────────────────────────────
    "rich>=13.7",
    "structlog>=24.1",

    # ── Progress & utilities ───────────────────────────────────────────────────
    "tqdm>=4.66",
    "tenacity>=8.2",
    "python-dateutil>=2.8",
    "pytz>=2024.1",

    # ── Probabilistic modelling ────────────────────────────────────────────────
    "statsmodels>=0.14",

    # ── Database (cp-10 settled-result conditioning) ───────────────────────────
    # psycopg v3 with the binary wheel: avoids the local libpq dependency on
    # CI runners. Used by scripts/regenerate_snapshot_from_batch.py and
    # simulation/load_settled.py to read match_outcomes when no parquet export
    # is staged. Both helpers prefer DIRECT_URL over DATABASE_URL so the
    # batch path bypasses any pgbouncer pooler.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    # cp-10.2: tests/test_kelly_sizer.py uses property-based testing. hypothesis
    # was an undeclared test dependency (present in local venvs, absent on a
    # fresh `pip install -e ".[dev]"`), so pytest collection failed in CI. The
    # cp-10.2 gate surfaced it; declaring it here keeps the suite runnable.
    "hypothesis>=6.0",
    # cp-36: tests/test_ablation_report.py validates ablation.json against
    # schema/ablation_v7.json (the schema's first consumer). jsonschema was an
    # undeclared test dependency (present in local venvs, absent on a fresh
    # `pip install -e ".[dev]"`), so CI failed at collection. The validation
    # must actually run in CI, so it is declared here rather than skipped.
    "jsonschema>=4.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion", "models", "simulation",
    "market", "evaluation", "utils",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
# cp-10.2: the El Voto 21J project shares this repo under the-21j-problem/ with
# its own tooling. Never lint their tree from this (WC) config — a bare
# `ruff check .` (editor, local, or another workflow) must not sweep it. The CI
# gate also lists WC paths explicitly; this is the belt-and-suspenders backstop.
# See PLAN.md Q9 and the 2026-06-05 cross-project coordination.
exclude = ["the-21j-problem/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
asyncio_mode = "auto"
