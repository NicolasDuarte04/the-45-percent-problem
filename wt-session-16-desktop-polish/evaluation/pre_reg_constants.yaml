# ---------------------------------------------------------------------------
# Phase 8 lockdown — keys consumed by evaluation/accuracy_metrics.py
# scoring_rules / diebold_mariano / nyberg were consolidated from config.yaml
# into this file during pre-registration. kill_criterion mirrors kill.ll_gap_se.
# ---------------------------------------------------------------------------
scoring_rules:
  log_loss_eps_min: 1.0e-6
diebold_mariano:
  comparisons:
    mstar_vs_m0:
      alpha: 0.05
    mstar_vs_market:
      alpha: 0.05
    all_other_pairwise:
      alpha: 0.005   # Bonferroni: 0.05 / 4 shadow comparisons
nyberg:
  logit_clip: 1.0e-6
  comparisons:
    mstar_primary:
      critical_value: 5.991  # chi2(2) at alpha=0.05
    shadow_bonferroni:
      critical_value: 8.668  # chi2(2) at alpha=0.0125 (Bonferroni)
accuracy_bootstrap:
  n_bootstrap: 10000
